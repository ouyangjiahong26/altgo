<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 40" width="440" height="40" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <!--
    悬浮窗相位：录音（按住触发键说话时）。
    几何与配色 1:1 复刻 frontend/src/overlay.css 与 src/styles/design-tokens.css（dark 主题）：
    悬浮条 248×40 圆角 6、红点 7px、扩散环 1px、轨迹视口 158×14 条宽 2px。
    改动这些值时要同步本文件。
  -->
  <style>
    .ring-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse-ring 1.8s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.6); opacity: 0.6; }
      70%  { transform: scale(1.8); opacity: 0; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    .bar {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation-name: bar-wave;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    .bar:nth-child(1) { animation-duration: 1.1s; animation-delay: -0.1s; }
    .bar:nth-child(2) { animation-duration: 1.5s; animation-delay: -0.3s; }
    .bar:nth-child(3) { animation-duration: 0.9s; animation-delay: -0.5s; }
    .bar:nth-child(4) { animation-duration: 1.3s; animation-delay: -0.7s; }
    .bar:nth-child(5) { animation-duration: 1.1s; animation-delay: -0.9s; }
    .bar:nth-child(6) { animation-duration: 1.4s; animation-delay: -1.1s; }
    .bar:nth-child(7) { animation-duration: 1.0s; animation-delay: -1.3s; }
    .bar:nth-child(8) { animation-duration: 1.6s; animation-delay: -1.5s; }
    @keyframes bar-wave {
      0%   { transform: scaleY(0.2); }
      50%  { transform: scaleY(1); }
      100% { transform: scaleY(0.4); }
    }
  </style>

  <defs>
    <!-- 7px 红点 + 扩散环（复刻 .dot / .dot::after，inset -3px） -->
    <g id="recording-dot">
      <circle class="ring-pulse" r="3.5" fill="none" stroke="#e06c75" stroke-width="1"/>
      <circle r="3.5" fill="#e06c75"/>
    </g>
  </defs>

  <!-- 悬浮条居中：440 宽画布、248 宽条，两侧各留 96 -->
  <rect x="96" y="0" width="248" height="40" rx="6" fill="#222222" stroke="#3a3a3a"/>
  <use href="#recording-dot" x="136" y="20"/>
  <!-- 轨迹右对齐、底部对齐：8 条 2px 红条，静止高度即 CSS 里的实测形状 -->
  <g fill="#e06c75">
    <rect class="bar" x="285" y="14" width="2" height="12" rx="1"/>
    <rect class="bar" x="288" y="14" width="2" height="12" rx="1"/>
    <rect class="bar" x="291" y="14" width="2" height="12" rx="1"/>
    <rect class="bar" x="294" y="14" width="2" height="12" rx="1"/>
    <rect class="bar" x="297" y="14" width="2" height="12" rx="1"/>
    <rect class="bar" x="300" y="14" width="2" height="12" rx="1"/>
    <rect class="bar" x="303" y="14" width="2" height="12" rx="1"/>
    <rect class="bar" x="306" y="14" width="2" height="12" rx="1"/>
  </g>
</svg>
