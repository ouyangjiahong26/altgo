# altgo 配置文件
# 复制到 ~/.config/altgo/altgo.toml 后修改

[key_listener]
# 触发键的 X11 keysym，默认 Alt_R 也就是右侧 Alt（与 xmodmap 中 keysym 名一致）。
# 若要用左侧 Alt，改为：key_name = "Alt_L"
# 以下两项可选，通常由设置页“按下以设置”自动写入：
# linux_evdev_code = 100   # Linux Wayland/evtest 使用的 evdev 键码（十进制）
# windows_vk_code = 56     # Windows 虚拟键码，与 linux_evdev_code 对等
key_name = "Alt_R"
long_press_threshold = 200          # 长按与短按的区分阈值（毫秒）
double_click_interval = 300         # 双击判定间隔（毫秒）
min_press_duration = 100            # 最短按下时长（毫秒），过滤输入法抖动

[recorder]
# SenseVoice 固定使用 16 kHz 单声道输入，其他采样率会被启动校验拒绝。
sample_rate = 16000

[transcriber]
model = "sense-voice"                  # 设置页下载后自动填入，也可填模型目录路径
language = "zh"                        # 语言，如 "zh"（中文）、"en"（英文），空字符串表示自动检测
                                        # （SenseVoice 支持中、英、日、韩、粤自动检测，在线识别空串时按 "auto" 发送）
threads = 0                            # 本地引擎线程数，0 表示自动取满 CPU 核数
backend = "local"                      # 转写后端："local"（本地 SenseVoice，默认）或 "online"（小米 MiMo 在线识别）
# backend = "local" 时使用内嵌 sherpa-onnx 的 SenseVoice 模型。
# 模型在管道启动时载入一次内存，之后每句话直接推理，无进程启动与冷载开销。

[transcriber.online]
# 在线转写配置，仅当 [transcriber] backend = "online" 时生效（低配机器可免下载本地模型）。
api_key = ""                        # API Key，也可通过 ALTGO_TRANSCRIBER_API_KEY 环境变量设置，online 时必填
api_base_url = "https://token-plan-cn.xiaomimimo.com/v1"   # MiMo 网关地址，已含 /v1
model = "mimo-v2.5-asr"             # 在线 ASR 模型名
timeout = 60                        # 请求超时时间（秒）

[polisher]
protocol = "openai"                 # "openai"（OpenAI 兼容 API）或 "anthropic"（Anthropic Messages API）
api_key = ""                        # API Key，也可通过 ALTGO_POLISHER_API_KEY 环境变量设置
api_base_url = ""                   # API Base URL，level 不为 "none" 时必须设置，带不带版本路径均可
                                     # （如 https://api.deepseek.com 或 https://api.moonshot.cn/v1）
model = ""                          # 模型名，level 不为 "none" 时必须设置
level = "none"                      # 润色级别："none"（禁用）、"light"、"medium"、"heavy"
max_tokens = 1024                   # LLM 响应的最大 token 数
timeout = 60                        # 请求超时时间（秒）
temperature = 0.3                   # LLM temperature（0.0 至 2.0）
thinking_level = "off"              # 思考层级："off"（默认，对已知服务商自动关闭思考）、"low"、"medium"、"high"
                                     # 档位映射各家参数：OpenAI 兼容端点 reasoning_effort，OpenRouter reasoning.effort，
                                     # 通义与 SiliconFlow enable_thinking，智谱、Kimi、DeepSeek 等 thinking.type（仅开关不分档），
                                     # Anthropic 协议按档给思考预算并自动抬高 max_tokens
system_prompt = ""                  # 自定义则完全替换内置，为空时按 [transcriber] language 生成（中文默认输出简体中文，勿繁体）

[output]
prefer_polished = true             # 剪贴板复制时优先使用润色后的文本
inject_text = false                # 转写完成后把文本自动输入到当前焦点窗口（仅 Windows，关闭时仅写剪贴板）

[gui]
language = ""                       # 界面语言："zh"、"en" 或空串（自动检测，跟随系统语言）
overlay_position = "bottom_center"  # 悬浮窗位置："bottom_center"（默认）或 "top_center"
auto_check_update = true            # 启动时是否自动检查更新
