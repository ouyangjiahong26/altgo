[package]
name = "altgo-tauri"
version = "2.7.3"
edition = "2021"
description = "altgo Tauri desktop application"

[lib]
name = "altgo_tauri"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "altgo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = ["tray-icon", "test"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time", "rt-multi-thread", "process", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.23"
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
dirs = "6"
futures-util = "0.3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
regex = "1"
thiserror = "2"
sha2 = "0.11"
sherpa-onnx = "=1.13.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
cpal = "0.18"
arboard = "3"

[dev-dependencies]
mockito = "1"
tempfile = "3"
