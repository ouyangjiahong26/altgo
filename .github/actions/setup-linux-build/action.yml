name: 'Setup Linux Build Environment'
description: 'Install system deps'
inputs:
  extra-packages:
    description: 'Extra apt packages to install (e.g. rpm)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    # azure 镜像在 amd64 runner 上反复慢至 ~85KB/s，62.7MB 的 webkit dev 包
    # 要下载 12 分钟（v2.5.10 release 实测该步骤卡 24 分钟）；换官方 GeoDNS
    # 主站后恢复常速。sed 对 arm64 源（不含该域名）无操作，幂等。
    - name: Use faster apt mirror
      shell: bash
      run: sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list
    # 缓存 .deb 命中时安装缩到秒级；缓存 key 含包列表与 version，
    # 镜像内包版本升级时 bump version 刷新。7 天未访问缓存会被逐出，
    # 故换源步骤须保留，覆盖缓存失效后的全量下载。
    - name: Install system dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev build-essential cmake ${{ inputs.extra-packages }}
        version: 1
    # 兜底直装：cache-apt action 在 cache-miss 安装路径上会静默失败
    # （v2.6.12 发版实测：19 秒"装完"8 个包、零 Setting up、退出码 0，
    # 还把 4.8KB 空缓存存进去毒化后续命中）。这里无条件 apt-get install：
    # 缓存真装上时是秒级 no-op，miss 或坏缓存时真正完成安装。
    - name: Ensure system dependencies installed
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev patchelf libasound2-dev build-essential cmake ${{ inputs.extra-packages }}
