name: Release

on:
  push:
    tags: ["v*"]

# 除创建 GitHub Release 外，其余 job 均只读取仓库内容。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: 校验发布元数据
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 校验 Tag 与版本
        run: bash packaging/scripts/validate-release.sh

  test:
    name: Run tests (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Cargo workspace 在 src-tauri；保留默认 job 隔离，避免 debug 测试缓存抢占
      # release 打包缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            src-tauri -> target

      - uses: ./.github/actions/setup-linux-build

      - name: Run tests
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib

  build-linux:
    name: 构建 Linux 软件包 (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # release 打包单独缓存同架构的 release 依赖编译产物。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            src-tauri -> target

      - uses: ./.github/actions/setup-linux-build
        with:
          extra-packages: "rpm"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 构建 deb、rpm 与 AppImage（若配置了签名密钥则生成 updater bundle 与签名）
      - name: 构建 deb、rpm 与 AppImage
        run: npm --prefix frontend exec -- tauri build --bundles deb,rpm,appimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: 上传 Linux 软件包产物
        uses: actions/upload-artifact@v4
        with:
          name: altgo-${{ matrix.arch }}-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: warn

  build-windows:
    name: 构建 Windows 安装包 (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            sherpa-archive: sherpa-onnx-v1.13.6-win-x64-static-MT-Release-lib.tar.bz2
          - arch: arm64
            target: aarch64-pc-windows-msvc
            sherpa-archive: sherpa-onnx-v1.13.6-win-arm64-static-MT-Release-lib.tar.bz2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            src-tauri -> target

      - name: Preload sherpa-onnx prebuilt libs
        shell: bash
        run: |
          mkdir -p src-tauri/target/sherpa-onnx-prebuilt
          ARCHIVE="${{ matrix.sherpa-archive }}"
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/${ARCHIVE}"
          curl -fSL -o "src-tauri/target/sherpa-onnx-prebuilt/${ARCHIVE}" "${URL}"
          tar -xjf "src-tauri/target/sherpa-onnx-prebuilt/${ARCHIVE}" -C src-tauri/target/sherpa-onnx-prebuilt/

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        if: matrix.arch == 'x64'
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib

      # arm64 在 x64 runner 上交叉编译，只能验证编译（无法执行 arm64 测试二进制）
      - name: Check compile (arm64)
        if: matrix.arch == 'arm64'
        run: cargo check --manifest-path=src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: 构建 NSIS 安装包
        run: npm --prefix frontend exec -- tauri build --target ${{ matrix.target }} --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: 上传 Windows 安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: altgo-windows-${{ matrix.arch }}-packages
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: warn

  gen-aur:
    name: Generate AUR PKGBUILD
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download deb artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: altgo-*-packages
          path: package-artifact
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate PKGBUILD
        run: |
          mapfile -t debs < <(find package-artifact -type f -name '*.deb' | sort)
          if [[ "${#debs[@]}" -ne 2 ]]; then
            echo "错误：预期恰好两份 deb 产物，实际找到 ${#debs[@]} 份" >&2
            printf '%s\n' "${debs[@]}" >&2
            exit 1
          fi
          AMD64_DEB="$(find package-artifact -name '*_amd64.deb' -type f -print -quit)"
          ARM64_DEB="$(find package-artifact -name '*_arm64.deb' -type f -print -quit)"
          if [[ -z "${AMD64_DEB}" || -z "${ARM64_DEB}" ]]; then
            echo "错误：必须同时包含 amd64 与 arm64 的 deb 产物" >&2
            exit 1
          fi
          mkdir -p aur-output
          cd aur-output
          bash ../packaging/aur/generate-pkgbuild.sh "${{ steps.version.outputs.value }}" "$(pwd)/../${AMD64_DEB}" "$(pwd)/../${ARM64_DEB}"

      - name: Upload AUR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: altgo-aur-pkgbuild
          path: |
            aur-output/PKGBUILD
            aur-output/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Create Release
    needs: [build-linux, build-windows, gen-aur]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write release notes from CHANGELOG
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash packaging/scripts/extract-release-notes.sh release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: 校验发布产物
        run: |
          mapfile -t debs < <(find release-assets -type f -name '*.deb' | sort)
          mapfile -t rpms < <(find release-assets -type f -name '*.rpm' | sort)
          mapfile -t appimages < <(find release-assets -type f -name '*.AppImage' | sort)
          mapfile -t exes < <(find release-assets -type f -name '*-setup.exe' | sort)
          if [[ "${#debs[@]}" -ne 2 || "${#rpms[@]}" -ne 2 || "${#appimages[@]}" -ne 2 || "${#exes[@]}" -ne 2 ]]; then
            echo "错误：预期两份 deb、两份 rpm、两份 AppImage、两份 exe（Windows x64 与 arm64 各一份），实际为 ${#debs[@]} 份 deb、${#rpms[@]} 份 rpm、${#appimages[@]} 份 AppImage、${#exes[@]} 份 exe" >&2
            find release-assets -type f | sort >&2
            exit 1
          fi
          printf '发布产物：\n%s\n' "$(find release-assets -type f | sort)"

      - name: Generate checksums
        run: |
          cd release-assets
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' \) -print0 | sort -z | xargs -0 sha256sum > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: 合并各平台 Updater 产物并生成 latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/scripts/merge-updater-json.sh release-assets release-assets/latest.json "${VERSION}" release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.AppImage
            release-assets/**/*.AppImage.sig
            release-assets/**/*-setup.exe
            release-assets/**/*-setup.exe.sig
            release-assets/latest.json
            release-assets/PKGBUILD
            release-assets/.SRCINFO
            checksums.txt
