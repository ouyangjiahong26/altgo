name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支的新提交无需等待旧提交完成，避免重复占用双架构 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    # 与 release Linux 构建一致，避免仅在较新 runner 上能通过、deb 在 22.04 上 GLIBC 不兼容
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Cargo workspace 在 src-tauri；默认的根目录 target/ 不存在，必须显式指定。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            src-tauri -> target

      # 系统依赖统一在 composite action 里装。
      # 多装 rpm 使 apt 缓存 key 与 release 构建一致：master 每次 push 都在为
      # release 预热缓存，避免发版时缓存未命中、走慢速镜像全量下载（实测卡 20+ 分钟）。
      - uses: ./.github/actions/setup-linux-build
        with:
          extra-packages: rpm

      - name: Preload sherpa-onnx prebuilt libs
        run: |
          mkdir -p src-tauri/target/sherpa-onnx-prebuilt
          ARCH="${{ matrix.arch == 'amd64' && 'x64' || 'aarch64' }}"
          ARCHIVE="sherpa-onnx-v1.13.6-linux-${ARCH}-static-lib.tar.bz2"
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/${ARCHIVE}"
          curl -fSL -o "src-tauri/target/sherpa-onnx-prebuilt/${ARCHIVE}" "${URL}"
          tar -xjf "src-tauri/target/sherpa-onnx-prebuilt/${ARCHIVE}" -C src-tauri/target/sherpa-onnx-prebuilt/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 前端测试、fmt 和 Clippy 不依赖目标架构，单跑一次即可；两个架构仍会
      # 分别执行测试，覆盖各自的编译及链接路径。
      - name: Run frontend tests
        if: matrix.arch == 'amd64'
        run: npm test
        working-directory: frontend

      - name: Check formatting
        if: matrix.arch == 'amd64'
        run: cargo fmt --manifest-path=src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        if: matrix.arch == 'amd64'
        run: cargo clippy --manifest-path=src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib

  check-windows:
    name: Check (windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            sherpa-archive: sherpa-onnx-v1.13.6-win-x64-static-MT-Release-lib.tar.bz2
          - arch: arm64
            target: aarch64-pc-windows-msvc
            sherpa-archive: sherpa-onnx-v1.13.6-win-arm64-static-MT-Release-lib.tar.bz2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            src-tauri -> target

      - name: Preload sherpa-onnx prebuilt libs
        shell: bash
        run: |
          mkdir -p src-tauri/target/sherpa-onnx-prebuilt
          ARCHIVE="${{ matrix.sherpa-archive }}"
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/${ARCHIVE}"
          curl -fSL -o "src-tauri/target/sherpa-onnx-prebuilt/${ARCHIVE}" "${URL}"
          tar -xjf "src-tauri/target/sherpa-onnx-prebuilt/${ARCHIVE}" -C src-tauri/target/sherpa-onnx-prebuilt/

      - name: Run tests
        if: matrix.arch == 'x64'
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib

      # arm64 在 x64 runner 上交叉编译，只能验证编译（无法执行 arm64 测试二进制）
      - name: Check compile (arm64)
        if: matrix.arch == 'arm64'
        run: cargo check --manifest-path=src-tauri/Cargo.toml --target ${{ matrix.target }}
