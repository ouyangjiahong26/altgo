<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>altgo 样式审查</title>
    <!-- 字体与产品窗口一致：index.html 由此引入 Inter，审查页若缺失会回退 system-ui，渲染与产品脱钩。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/components/ui-primitives.css" />
    <link rel="stylesheet" href="src/styles/pages/home.css" />
    <link rel="stylesheet" href="src/styles/pages/settings.css" />
    <link rel="stylesheet" href="src/styles/pages/history.css" />
    <link rel="stylesheet" href="src/styles/pages/onboarding.css" />
    <link rel="stylesheet" href="src/overlay.css" />
    <link rel="stylesheet" href="src/styles/pages/update-notes.css" />
    <link rel="stylesheet" href="review/review.css" />
    <style>
      /* 索引页独有：分页卡片 */
      .sr-index {
        max-width: 720px;
        margin: 0 auto;
        padding: var(--space-8) var(--space-5);
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      .sr-index-card {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        padding: var(--space-4) var(--space-5);
        background: var(--color-surface-2);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        color: var(--color-text);
        text-decoration: none;
        transition: border-color var(--duration-normal) var(--ease-out), background var(--duration-normal) var(--ease-out);
      }
      .sr-index-card:hover {
        border-color: var(--color-border-strong);
        background: var(--color-surface-3);
      }
      .sr-index-card b {
        font-size: var(--text-base);
        font-weight: 600;
      }
      .sr-index-card span {
        font-size: var(--text-xs);
        color: var(--color-text-muted);
      }
    </style>
  </head>
  <body>
<header class="sr-top">
      <div>
        <div class="sr-title"><a href="style-review.html" style="color: inherit; text-decoration: none">altgo 样式审查</a> · 目录</div>
        <div class="sr-sub">加载产品真实样式表预览，与实际软件渲染一致，可切换深浅主题与根字号（15 / 17 / 19）。</div>
      </div>
      <div class="sr-ctl" role="group" aria-label="主题">
        <button type="button" data-theme-btn="dark" aria-pressed="true">暗色</button>
        <button type="button" data-theme-btn="light" aria-pressed="false">亮色</button>
      </div>
      <div class="sr-ctl" role="group" aria-label="根字号">
        <button type="button" data-size-btn="15" aria-pressed="false">15px</button>
        <button type="button" data-size-btn="17" aria-pressed="true">17px</button>
        <button type="button" data-size-btn="19" aria-pressed="false">19px</button>
      </div>
    </header>
    <div class="sr-index">
      <p class="sr-desc">
        样式审查页按主题拆为五个分页，均加载产品真实样式表，与实际软件渲染一致，
        可切换深浅主题与根字号。
      </p>
        <a class="sr-index-card" href="review/tokens.html">
          <b>设计 token</b>
          <span>色彩 token · 排版 · 间距 / 圆角 / 动效</span>
        </a>
        <a class="sr-index-card" href="review/foundations.html">
          <b>基础与组件</b>
          <span>基础层 · UI Primitives · Layout 头部</span>
        </a>
        <a class="sr-index-card" href="review/screens.html">
          <b>界面</b>
          <span>设置页 · 首次引导</span>
        </a>
        <a class="sr-index-card" href="review/windows.html">
          <b>窗口</b>
          <span>悬浮窗 · 更新说明窗口</span>
        </a>
        <a class="sr-index-card" href="review/pages.html">
          <b>页面整体</b>
          <span>主页与设置页整窗预览（空态 / 转写中 / 错误 / 结果互斥状态）</span>
        </a>
    </div>
    <script src="review/review.js"></script>
  </body>
</html>
