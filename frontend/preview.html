<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>altgo 界面预览</title>
    <link rel="icon" href="public/altgo-logo.svg" type="image/svg+xml" />
    <!--
      改完样式后的唯一入口：一页看全各窗口的实际渲染。
      直接加载 frontend/src 下的真实样式表，改完刷新即可，不需要构建或截图。
      需要逐项 token 与组件清单时，再去 style-review.html。

      这里的窗口标记是按 src/pages、src/components 的真实 JSX 手抄的：改产品标记时
      必须同步改本页，否则预览会与真机不符。图标用 lucide 的真实路径内联
      （lucide-react 的 .lucide 基础样式给的是 width/height:24px，所以内联时必须显式写尺寸，
      否则图标会比真机大一圈）。
    -->
    <!-- 字体与真实窗口一致：产品里由 index.html 引入 Inter，CSS 里只留回退栈 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- 主窗链，顺序与 src/main.tsx 一致（global.css 内部再 import design-system 与 motion） -->
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/components/ui-primitives.css" />
    <link rel="stylesheet" href="src/styles/pages/home.css" />
    <link rel="stylesheet" href="src/styles/pages/settings.css" />
    <link rel="stylesheet" href="src/styles/pages/history.css" />
    <link rel="stylesheet" href="src/styles/pages/onboarding.css" />
    <!-- 悬浮窗链，顺序与 src/overlay.tsx 一致 -->
    <link rel="stylesheet" href="src/styles/overlay-base.css" />
    <link rel="stylesheet" href="src/styles/motion.css" />
    <link rel="stylesheet" href="src/overlay.css" />
    <!-- 更新说明窗链，顺序与 src/update-notes.tsx 一致（global 与 ui-primitives 已在上面载入） -->
    <link rel="stylesheet" href="src/styles/pages/update-notes.css" />
    <style>
      /* 本页自身的框架样式：与产品样式隔离，全部用 pv- 前缀。

         两处必须覆盖产品规则：
         1. overlay-base.css 把 html/body 设成 100% 高、overflow:hidden、不可选中，
            那是给只装一个窗口的悬浮窗页面用的，预览页要能滚动、要能选中文字。
         2. 根字号按产品默认（ui-size.ts 的 medium = 17px）设一次，配置切到小/大档
            时产品整体缩放，预览页仍以默认档核对。 */
      html {
        height: auto;
        overflow: auto;
        font-size: 17px;
        background: var(--color-bg);
      }
      body {
        width: auto;
        height: auto;
        margin: 0;
        padding: 0 0 56px;
        display: block;
        overflow: auto;
        cursor: auto;
        user-select: text;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
      }
      .pv-top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: var(--space-4);
        padding: var(--space-3) var(--space-5);
        background: var(--color-bg);
        border-bottom: 1px solid var(--color-border-subtle);
      }
      .pv-title { font-size: var(--text-base); font-weight: var(--font-semibold); }
      .pv-title span { color: var(--color-text-muted); font-weight: var(--font-regular); }
      .pv-actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); }
      .pv-hint { font-size: var(--text-xs); color: var(--color-text-muted); }

      .pv-body { padding: var(--space-5); }
      .pv-group { margin-bottom: var(--space-8); }
      .pv-group > h2 {
        margin: 0 0 var(--space-3);
        font-size: var(--text-xs);
        font-weight: var(--font-semibold);
        color: var(--color-text-muted);
      }
      /* 窗口横排，放不下就换行 */
      .pv-row { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
      .pv-item { display: flex; flex-direction: column; gap: var(--space-2); }
      .pv-item > figcaption { font-size: var(--text-xs); color: var(--color-text-muted); }
      figure.pv-item { margin: 0; }

      /* 窗口框：按 tauri.conf.json 的真实窗口尺寸裁切（主窗 440×680） */
      .pv-win {
        position: relative;
        width: 440px;
        max-width: 100%;
        height: 680px;
        overflow: hidden;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-2xl);
        background: var(--color-bg);
      }
      .pv-win .layout { height: 100%; }
      .pv-win .layout-main { overflow-y: auto; }

      /* 引导向导在产品里是 fixed 整窗层，预览框里收回框内 */
      .pv-win .onboarding {
        position: absolute;
        inset: 0;
        border-radius: 0;
      }

      /* 悬浮窗是 280×64 的透明窗，用棋盘底衬出边界 */
      .pv-ov {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        width: 280px;
        height: 64px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background-color: var(--color-surface-1);
        background-image:
          linear-gradient(45deg, var(--color-surface-3) 25%, transparent 25%, transparent 75%, var(--color-surface-3) 75%),
          linear-gradient(45deg, var(--color-surface-3) 25%, transparent 25%, transparent 75%, var(--color-surface-3) 75%);
        background-size: 12px 12px;
        background-position: 0 0, 6px 6px;
        overflow: hidden;
      }

      /* 更新说明窗是 340×400 的不透明窗 */
      .pv-notes {
        width: 340px;
        height: 400px;
        overflow: hidden;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-bg);
      }
      .pv-notes .update-notes-window { height: 400px; }

      /* 折叠区：SOP 里不常看的内容收在这里 */
      details.pv-more {
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-lg);
        background: var(--color-surface-1);
        padding: var(--space-3) var(--space-4);
        margin-bottom: var(--space-3);
      }
      details.pv-more > summary {
        cursor: pointer;
        font-size: var(--text-sm);
        font-weight: var(--font-medium);
        color: var(--color-text-secondary);
      }
      details.pv-more[open] > summary { margin-bottom: var(--space-3); }

      .pv-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--space-2); }
      .pv-swatch {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-2);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-md);
        background: var(--color-surface-0);
      }
      .pv-chip {
        width: 22px;
        height: 22px;
        flex: none;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border);
      }
      .pv-swatch code { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-text-muted); }

      .pv-links { display: flex; flex-wrap: wrap; gap: var(--space-2); }
      .pv-links a {
        display: inline-flex;
        align-items: center;
        height: var(--control-height);
        padding: 0 var(--space-3);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-surface-2);
        color: var(--color-text);
        font-size: var(--text-xs);
        text-decoration: none;
      }
      .pv-links a:hover { background: var(--color-surface-3); border-color: var(--color-border-strong); }
    </style>
  </head>
  <body>
    <header class="pv-top">
      <div class="pv-title">altgo 界面预览 <span>· 改完样式刷新本页即可</span></div>
      <div class="pv-actions">
        <span class="pv-hint">配色</span>
        <div class="segmented" role="group" aria-label="配色">
          <button type="button" id="pv-light">浅色</button>
          <button type="button" id="pv-dark">深色</button>
        </div>
      </div>
    </header>

    <div class="pv-body">
      <!-- ═══════════ 主窗 · 主页 ═══════════ -->
      <div class="pv-group">
        <h2>主窗 440×680 · 主页</h2>
        <div class="pv-row">
          <!-- 空态：自检卡展开态 + 状态块 + 历史空态（Home.tsx 的 !transcription 分支） -->
          <figure class="pv-item">
            <div class="pv-win">
              <div class="layout">
                <header class="layout-header">
                  <div class="layout-header-left"><div class="layout-logo-wrapper"><img src="public/altgo-logo.svg" alt="" width="18" height="18" class="layout-logo-mark" /><span class="layout-logo">altgo</span></div><span class="layout-subtitle">语音转文字</span></div>
                  <div class="layout-header-right"><div class="window-controls">
                      <button type="button" class="window-control-btn" aria-label="最小化"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
                      <button type="button" class="window-control-btn" aria-label="最大化"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></svg></button>
                      <button type="button" class="window-control-btn window-control-close" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></div>
                </header>
                <main class="layout-main">
                  <div class="home">
                    <!-- 触发键自检卡（probe.kind === "prompt"）：内容卡，常驻内容流顶部 -->
                    <div class="home-probe-area">
                      <div class="home-probe" aria-live="polite">
                        <div class="home-probe-head"><span>先确认触发键能用</span></div>
                        <p class="home-probe-detail">按一下触发键，看它能不能被识别。检测要按住触发键说一句话，这一下会正常录音。不检测也可以直接开始用。</p>
                        <div class="home-probe-actions">
                          <button type="button" class="btn btn-sm btn-primary"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></svg><span>开始检测</span></button>
                          <button type="button" class="btn btn-sm btn-secondary"><span>以后再说</span></button>
                        </div>
                      </div>
                    </div>
                    <section class="home-state">
                      <!-- 状态块：统计面范式，状态色只染图标与数值 -->
                      <div class="stat-card home-state-card">
                        <div class="stat-card-head">
                          <span class="stat-card-label">当前状态</span>
                          <span class="stat-card-icon home-state-icon" style="color: var(--color-text-muted)" aria-hidden="true">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg>
                          </span>
                        </div>
                        <div class="stat-card-value home-status-text" style="color: var(--color-text-muted)">等待说话</div>
                        <p class="stat-card-hint home-trigger-hint">按住 <span class="kbd">右Alt</span> 说话，松开即得文字</p>
                      </div>
                    </section>
                    <div class="history-page">
                      <div class="history-page-header">
                        <h1 class="section-label history-page-title">转写历史</h1>
                        <div class="history-toolbar">
                          <label class="history-select-all"><input type="checkbox" disabled /><span>全选</span></label>
                          <button type="button" class="btn btn-sm btn-danger" disabled><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>删除所选</button>
                          <button type="button" class="btn btn-sm btn-outline btn-danger" disabled><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>清空全部</button>
                        </div>
                      </div>
                      <!-- 历史空态只给图标与一句指引，动作留给上面的状态块 -->
                      <div class="empty-state history-empty">
                        <div class="empty-state-icon">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
                        </div>
                        <p class="empty-state-hint">暂无历史记录。完成一次语音转写后会自动出现在此处。</p>
                      </div>
                    </div>
                  </div>
                </main>
                <!-- 浮动底栏：主窗唯一的全局导航，贴在窗口下沿 -->
                <div class="layout-dock-wrap">
                  <nav class="layout-dock" aria-label="主导航">
                    <a class="dock-item active" href="#pv"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>主页</span></a>
                    <a class="dock-item" href="#pv"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></a>
                  </nav>
                </div>
              </div>
            </div>
            <figcaption>空态：触发键自检卡 + 状态块 + 历史空态，底栏「主页」高亮</figcaption>
          </figure>

          <!-- 结果态：转写结果卡 + 历史列表（Home.tsx 的 transcription 分支） -->
          <figure class="pv-item">
            <div class="pv-win">
              <div class="layout">
                <header class="layout-header">
                  <div class="layout-header-left"><div class="layout-logo-wrapper"><img src="public/altgo-logo.svg" alt="" width="18" height="18" class="layout-logo-mark" /><span class="layout-logo">altgo</span></div><span class="layout-subtitle">语音转文字</span></div>
                  <div class="layout-header-right"><div class="window-controls">
                      <button type="button" class="window-control-btn" aria-label="最小化"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
                      <button type="button" class="window-control-btn" aria-label="最大化"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></svg></button>
                      <button type="button" class="window-control-btn window-control-close" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></div>
                </header>
                <main class="layout-main">
                  <div class="home">
                    <section class="home-result">
                      <div class="home-result-card">
                        <div class="home-result-head">
                          <span class="home-result-label">转写结果</span>
                          <span class="home-result-meta">刚刚</span>
                        </div>
                        <p class="home-result-text">这次评审我先过一遍材料，把行动项按负责人和截止时间整理成三列，下午三点前发到群里。</p>
                        <div class="home-result-foot">
                          <button type="button" class="btn btn-sm btn-secondary home-copy-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><span>复制到剪贴板</span></button>
                        </div>
                      </div>
                    </section>
                    <div class="history-page">
                      <div class="history-page-header">
                        <h1 class="section-label history-page-title">转写历史</h1>
                        <div class="history-toolbar">
                          <label class="history-select-all"><input type="checkbox" /><span>全选</span></label>
                          <button type="button" class="btn btn-sm btn-danger"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>删除所选</button>
                          <button type="button" class="btn btn-sm btn-outline btn-danger"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>清空全部</button>
                        </div>
                      </div>
                      <ul class="history-list">
                        <li class="history-item">
                          <label class="history-item-check"><input type="checkbox" checked /></label>
                          <div class="history-item-body">
                            <!-- 首行是索引：时间 + 来源与各环节耗时徽标 -->
                            <div class="history-item-top">
                              <time class="history-item-time" datetime="2026-10-21T18:06:00+08:00">2026/10/21 18:06</time>
                              <div class="history-item-meta">
                                <span class="badge history-item-badge">本地识别</span>
                                <span class="badge history-item-badge history-item-stage">录音 4.2 秒</span>
                                <span class="badge history-item-badge history-item-stage">识别 0.8 秒</span>
                                <span class="badge history-item-badge history-item-stage">润色 1.9 秒</span>
                              </div>

    <script>
      // token 色板：直接读计算值，保证显示的就是当前生效的颜色。
      // 必须在切换主题之后重渲染，否则色板停留在上一次主题的取值。
      const TOKENS = [
        "--color-bg", "--color-surface-1", "--color-surface-2", "--color-surface-3",
        "--color-border", "--color-border-strong",
        "--color-text", "--color-text-muted", "--color-text-faint",
        "--color-accent", "--color-fill-inverse",
        "--color-green", "--color-amber", "--color-red", "--color-blue",
      ];
      const host = document.getElementById("pv-tokens");
      const renderTokens = () => {
        const cs = getComputedStyle(document.documentElement);
        host.innerHTML = TOKENS.map((name) => {
          const value = cs.getPropertyValue(name).trim();
          return `<div class="pv-swatch"><span class="pv-chip" style="background:${value}"></span><code>${name}</code></div>`;
        }).join("");
      };

      // 配色切换：只改 data-theme，样式表由 CSS 变量自动跟进。
      // 与产品默认一致，初始为浅色。支持 ?theme=dark 直接指定，便于截图核对。
      const setTheme = (theme) => {
        document.documentElement.dataset.theme = theme;
        document.getElementById("pv-light").classList.toggle("is-active", theme === "light");
        document.getElementById("pv-dark").classList.toggle("is-active", theme === "dark");
        renderTokens();
      };
      document.getElementById("pv-light").addEventListener("click", () => setTheme("light"));
      document.getElementById("pv-dark").addEventListener("click", () => setTheme("dark"));
      setTheme(new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light");
    </script>
