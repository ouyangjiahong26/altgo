<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (function () {
        try {
          var k = "altgo-theme-pref";
          var p = localStorage.getItem(k) || "system";
          var dark =
            p === "dark" ? true : p === "light" ? false : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var fs = localStorage.getItem("altgo-font-size");
          document.documentElement.style.fontSize =
            fs === "small" ? "15px" : fs === "large" ? "19px" : "17px";
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>altgo</title>
    <!-- 字体走 HTML 引入而非 CSS @import：CSS 里的远程 @import 会在离线时挂起，
         阻塞同一张样式表后续的 @import 解析（本地样式跟着不生效）。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="icon" href="/altgo-logo.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
