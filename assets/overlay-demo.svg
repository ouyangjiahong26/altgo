<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <!-- altgo 悬浮窗三相位动画演示：几何与配色 1:1 复刻 frontend/src/overlay.css（dark token） -->
  <style>
    .ring-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse-ring 1.6s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.6); opacity: 0.7; }
      70%  { transform: scale(1.9); opacity: 0; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    .bar {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation-duration: 1.2s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    .bar:nth-child(1) { animation-duration: 1.1s; animation-delay: -0.1s; }
    .bar:nth-child(2) { animation-duration: 1.5s; animation-delay: -0.3s; }
    .bar:nth-child(3) { animation-duration: 0.9s; animation-delay: -0.5s; }
    .bar:nth-child(4) { animation-duration: 1.3s; animation-delay: -0.7s; }
    .bar:nth-child(5) { animation-duration: 1.1s; animation-delay: -0.9s; }
    .bar:nth-child(6) { animation-duration: 1.4s; animation-delay: -1.1s; }
    .bar:nth-child(7) { animation-duration: 1.0s; animation-delay: -1.3s; }
    .bar:nth-child(8) { animation-duration: 1.6s; animation-delay: -1.5s; }
    @keyframes bar-wave {
      0%   { transform: scaleY(0.18); }
      50%  { transform: scaleY(1); }
      100% { transform: scaleY(0.35); }
    }
    .spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .slide {
      animation: slide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    @keyframes slide {
      from { transform: translateX(0); }
      to   { transform: translateX(95px); }
    }
    .close-x {
      animation: close-fade 2.4s ease-in-out infinite;
    }
    @keyframes close-fade {
      0%, 45%  { opacity: 0; }
      55%, 78% { opacity: 1; }
      100%     { opacity: 0; }
    }
  </style>

  <defs>
    <!-- 8px 红点 + 扩散环（复刻 .dot/.dot::after） -->
    <g id="recording-dot">
      <circle class="ring-pulse" r="4" fill="none" stroke="#fb7185" stroke-width="1.5"/>
      <circle r="4" fill="#fb7185"/>
    </g>
    <!-- 14px 旋转环：轨道 + 1/4 琥珀弧（复刻 .processing-ring） -->
    <g id="spin-ring">
      <circle r="7" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
      <circle class="spin" r="7" fill="none" stroke="#fbbf24" stroke-width="2"
              stroke-linecap="round" stroke-dasharray="11 33"/>
    </g>
  </defs>

  <!-- ═══ 帧一：录音 ═══ -->
  <text x="460" y="12" text-anchor="end" font-size="11" fill="#71717a">按住说话</text>
  <rect x="180" y="18" width="280" height="64" rx="6" fill="none"
        stroke="rgba(148,163,184,0.35)" stroke-dasharray="4 3"/>
  <rect x="196" y="30" width="248" height="40" rx="20" fill="rgb(22,22,28)"
        stroke="rgba(255,255,255,0.12)"/>
  <use href="#recording-dot" x="236" y="50"/>
  <!-- 轨迹视口 158×14，8 条 2px 红条右对齐（复刻 .level-trace/.trace-bar） -->
  <g fill="#fb7185">
    <rect class="bar" x="385" y="41" width="2" height="12" rx="1"/>
    <rect class="bar" x="388" y="41" width="2" height="12" rx="1"/>
    <rect class="bar" x="391" y="41" width="2" height="12" rx="1"/>
    <rect class="bar" x="394" y="41" width="2" height="12" rx="1"/>
    <rect class="bar" x="397" y="41" width="2" height="12" rx="1"/>
    <rect class="bar" x="400" y="41" width="2" height="12" rx="1"/>
    <rect class="bar" x="403" y="41" width="2" height="12" rx="1"/>
    <rect class="bar" x="406" y="41" width="2" height="12" rx="1"/>
  </g>

  <!-- ═══ 帧二：转写 ═══ -->
  <text x="460" y="104" text-anchor="end" font-size="11" fill="#71717a">松开转写</text>
  <rect x="180" y="110" width="280" height="64" rx="6" fill="none"
        stroke="rgba(148,163,184,0.35)" stroke-dasharray="4 3"/>
  <rect x="196" y="122" width="248" height="40" rx="20" fill="rgb(22,22,28)"
        stroke="rgba(255,255,255,0.12)"/>
  <use href="#spin-ring" x="236" y="142"/>
  <!-- 进度线 158×3：轨道 + 滑块（复刻 .overlay-tx-progress-track/-fill indeterminate） -->
  <rect x="253" y="140.5" width="158" height="3" rx="1.5" fill="rgba(255,255,255,0.14)"/>
  <rect class="slide" x="253" y="140.5" width="63" height="3" rx="1.5" fill="#fbbf24"/>

  <!-- ═══ 帧三：结果 ═══ -->
  <text x="460" y="196" text-anchor="end" font-size="11" fill="#71717a">结果进剪贴板</text>
  <rect x="180" y="202" width="280" height="64" rx="6" fill="none"
        stroke="rgba(148,163,184,0.35)" stroke-dasharray="4 3"/>
  <rect x="196" y="214" width="248" height="40" rx="20" fill="rgb(22,22,28)"
        stroke="rgba(255,255,255,0.12)"/>
  <!-- ✓ 圆盘 18px（复刻 .done-indicator） -->
  <circle cx="219" cy="234" r="9" fill="rgba(52,211,153,0.12)"/>
  <path d="M 215 234 L 218 237 L 224 230" fill="none" stroke="#34d399"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="238" y="238.5" font-size="13" fill="#e4e4e7">帮我把今天下午的会改到四…</text>
  <!-- ×：悬停胶囊时淡入（复刻 .btn-close） -->
  <g class="close-x" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-linecap="round">
    <line x1="415" y1="227" x2="429" y2="241"/>
    <line x1="429" y1="227" x2="415" y2="241"/>
  </g>
</svg>
